name: Release

# Push a version tag (e.g. v0.1.0) whose version matches module.json to
# publish a release that Foundry can install from the manifest URL.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build -- "$GITHUB_REF_NAME"
      - run: node tools/release/notes.js "$GITHUB_REF_NAME" > dist/notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/module.zip dist/module.json
          --title "Fate Dice $GITHUB_REF_NAME" --notes-file dist/notes.md
